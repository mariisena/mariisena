<svg width="800" height="180" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" role="img"
                        aria-label="Canal seguro entre você e Mari — conexão criptografada ponta a ponta">
<style>.cn-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}.cn-sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}@keyframes cn-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}@keyframes cn-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}@keyframes cn-livep{0%,100%{opacity:.3}50%{opacity:1}}@keyframes cn-pk{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(440px);opacity:0}}@keyframes cn-a{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes cn-b{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@keyframes cn-pulse{0%{r:26px;opacity:.6}100%{r:40px;opacity:0}}.cn-au1{animation:cn-drift1 14s ease-in-out infinite;}.cn-au2{animation:cn-drift2 18s ease-in-out infinite;}.cn-live{animation:cn-livep 1.6s ease-in-out infinite;}.cn-p{animation:cn-pk 2s linear infinite;}.cn-A{animation:cn-a 6s ease-in-out infinite;}.cn-B{opacity:0;animation:cn-b 6s ease-in-out infinite;}.cn-pl{animation:cn-pulse 2s ease-out infinite;}.cn-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}.cn-link{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 16px 0 12px;border-radius:999px;background:rgba(22,24,38,.7);border:1px solid rgba(145,132,217,.6);color:#C4BEEC;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;text-decoration:none;transition:border-color .2s,box-shadow .2s,transform .2s;}.cn-link:hover{border-color:#C4BEEC;box-shadow:0 0 14px rgba(145,132,217,.45);transform:translateY(-2px);}.cn-link img{width:16px;height:16px;}</style>
<defs>
<!-- Borda com brilho que percorre a moldura -->
<linearGradient id="cn-bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0"
spreadMethod="reflect">
<stop offset="0" stop-color="#9184D9" stop-opacity=".15" />
<stop offset=".5" stop-color="#C4BEEC" stop-opacity=".95" />
<stop offset="1" stop-color="#9184D9" stop-opacity=".15" />
<animateTransform attributeName="gradientTransform" type="translate" from="0 0"
to="1600 0" dur="8s" repeatCount="indefinite" />
</linearGradient>
<filter id="cn-blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="40" />
</filter>
<clipPath id="cn-fc">
<rect width="800" height="180" rx="14" />
</clipPath>
<pattern id="cn-grid" width="26" height="26" patternUnits="userSpaceOnUse">
<path d="M26 0H0V26" fill="none" stroke="#9184D9" stroke-opacity=".07" />
</pattern>
</defs>

<!-- ===== Fundo: cor, auroras, grade e barra de título ===== -->
<g clip-path="url(#cn-fc)">
<rect width="800" height="180" fill="#1a1c2b" />
<g filter="url(#cn-blur)" opacity=".6">
<ellipse class="cn-au1" cx="160" cy="144" rx="160" ry="70" fill="#9184D9"
fill-opacity=".3" />
<ellipse class="cn-au2" cx="640" cy="45" rx="180" ry="80" fill="#5a4f9e"
fill-opacity=".45" />
</g>
<rect y="35" width="800" height="145" fill="url(#cn-grid)" />
<rect width="800" height="34" fill="#161826" fill-opacity=".75" />
<rect y="34" width="800" height="1" fill="#9184D9" fill-opacity=".22" />
</g>

<!-- Moldura com gradiente animado -->
<rect x=".5" y=".5" width="799" height="179" rx="14" fill="none" stroke="url(#cn-bd)"
stroke-width="1.2" />

<!-- Barra de título: bolinhas, título e LIVE -->
<g fill="#4a4c63">
<circle cx="20" cy="17" r="4.5" />
<circle cx="35" cy="17" r="4.5" />
<circle cx="50" cy="17" r="4.5" />
</g>
<text class="cn-mono" x="68" y="21" font-size="11" letter-spacing="1.5" fill="#9A9CB0">MARI.EXE
<tspan fill="#9184D9">//</tspan> CANAL SEGURO</text>
<g class="cn-mono" font-size="10" letter-spacing="1.5">
<circle class="cn-live" cx="738" cy="17" r="3.5" fill="#9184D9" />
<text x="748" y="21" fill="#C4BEEC">LIVE</text>
</g>

<!-- Cantoneiras inferiores -->
<g fill="none" stroke="#9184D9" stroke-width="2" stroke-linecap="round" stroke-opacity=".8">
<path d="M10 154v16h16" />
<path d="M790 154v16h-16" />
</g>

<!-- Todo o conteúdo abaixo está deslocado 30px para baixo -->
<g transform="translate(0,30)">
<!-- Ondas pulsando ao redor dos dois nós -->
<circle class="cn-pl" cx="140" cy="62" r="26" fill="none" stroke="#9184D9" />
<circle class="cn-pl" cx="660" cy="62" r="26" fill="none" stroke="#9184D9"
style="animation-delay:1s" />

<!-- Nós: você ↔ mari -->
<circle cx="140" cy="62" r="26" fill="#2a2648" stroke="#9184D9" />
<text class="cn-mono" x="140" y="67" font-size="13" fill="#E9E9ED"
text-anchor="middle">você</text>
<circle cx="660" cy="62" r="26" fill="#2a2648" stroke="#9184D9" />
<text class="cn-mono" x="660" y="67" font-size="13" fill="#E9E9ED"
text-anchor="middle">mari</text>

<!-- Linha de transmissão + pacotes viajando -->
<path d="M176 62H624" stroke="#9184D9" stroke-opacity=".35" stroke-dasharray="4 6" />
<g fill="#C4BEEC">
<rect class="cn-p" x="176" y="58" width="12" height="8" rx="2" />
<rect class="cn-p" x="176" y="58" width="12" height="8" rx="2"
style="animation-delay:.66s" />
<rect class="cn-p" x="176" y="58" width="12" height="8" rx="2"
style="animation-delay:1.33s" />
</g>

<!-- Mensagem alternando: cifrada ↔ decifrada -->
<g class="cn-mono" font-size="14" text-anchor="middle">
<text class="cn-A" x="400" y="34" fill="#9184D9">🔐 7f3a 9c1e b04d 22af e21b</text>
<text class="cn-B" x="400" y="34" fill="#E9E9ED">🔓 "Oi, Mari! Bora tomar um
café?"</text>
<text x="400" y="118" font-size="12" fill="#9A9CB0">conexão criptografada · ponta a
ponta</text>
</g>
</g>
</svg>
