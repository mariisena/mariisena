<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img"
                        aria-label="Laboratório — Detecção de Ameaças Cibernéticas baseada em IA">
<style>.ps-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}.ps-sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}@keyframes ps-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}@keyframes ps-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}@keyframes ps-livep{0%,100%{opacity:.3}50%{opacity:1}}@keyframes ps-flow{to{stroke-dashoffset:-20}}@keyframes ps-node{0%,100%{fill:#232532}15%,35%{fill:#9184D9}}@keyframes ps-draw{0%{stroke-dashoffset:1;opacity:1}45%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes ps-show{0%,26%{opacity:0}30%,88%{opacity:1}100%{opacity:0}}@keyframes ps-ring{0%,28%{r:5px;opacity:0}30%{opacity:.9}55%{r:22px;opacity:0}100%{opacity:0}}@keyframes ps-threat{0%,26%{fill:#9A9CB0}30%,88%{fill:#C4BEEC}100%{fill:#9A9CB0}}@keyframes ps-blink{50%{opacity:.3}}.ps-au1{animation:ps-drift1 14s ease-in-out infinite;}.ps-au2{animation:ps-drift2 18s ease-in-out infinite;}.ps-live{animation:ps-livep 1.6s ease-in-out infinite;}.ps-e{stroke-dasharray:4 6;animation:ps-flow 1s linear infinite;}.ps-n{fill:#232532;animation:ps-node 2.4s ease-in-out infinite;}.ps-l2{animation-delay:.4s;}.ps-l3{animation-delay:.8s;}.ps-line{stroke-dasharray:1;animation:ps-draw 6s ease-in-out infinite;}.ps-an{animation:ps-show 6s ease-in-out infinite;}.ps-rg{animation:ps-ring 6s ease-out infinite;}.ps-th{fill:#9A9CB0;animation:ps-threat 6s ease-in-out infinite;}.ps-bl{animation:ps-blink 1.4s ease-in-out infinite;}</style>
<defs>
<!-- Borda com brilho que percorre a moldura -->
<linearGradient id="ps-bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0"
spreadMethod="reflect">
<stop offset="0" stop-color="#9184D9" stop-opacity=".15" />
<stop offset=".5" stop-color="#C4BEEC" stop-opacity=".95" />
<stop offset="1" stop-color="#9184D9" stop-opacity=".15" />
<animateTransform attributeName="gradientTransform" type="translate" from="0 0"
to="1600 0" dur="8s" repeatCount="indefinite" />
</linearGradient>
<filter id="ps-blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="40" />
</filter>
<clipPath id="ps-fc">
<rect width="800" height="320" rx="14" />
</clipPath>
<pattern id="ps-grid" width="26" height="26" patternUnits="userSpaceOnUse">
<path d="M26 0H0V26" fill="none" stroke="#9184D9" stroke-opacity=".07" />
</pattern>
</defs>

<!-- ===== Fundo: cor, auroras, grade e barra de título ===== -->
<g clip-path="url(#ps-fc)">
<rect width="800" height="320" fill="#1a1c2b" />
<g filter="url(#ps-blur)" opacity=".6">
<ellipse class="ps-au1" cx="160" cy="256" rx="160" ry="70" fill="#9184D9"
fill-opacity=".3" />
<ellipse class="ps-au2" cx="640" cy="80" rx="180" ry="80" fill="#5a4f9e"
fill-opacity=".45" />
</g>
<rect y="35" width="800" height="285" fill="url(#ps-grid)" />
<rect width="800" height="34" fill="#161826" fill-opacity=".75" />
<rect y="34" width="800" height="1" fill="#9184D9" fill-opacity=".22" />
</g>

<!-- Moldura com gradiente animado -->
<rect x=".5" y=".5" width="799" height="319" rx="14" fill="none" stroke="url(#ps-bd)"
stroke-width="1.2" />

<!-- Barra de título: bolinhas, título e LIVE -->
<g fill="#4a4c63">
<circle cx="20" cy="17" r="4.5" />
<circle cx="35" cy="17" r="4.5" />
<circle cx="50" cy="17" r="4.5" />
</g>
<text class="ps-mono" x="68" y="21" font-size="11" letter-spacing="1.5" fill="#9A9CB0">MARI.EXE
<tspan fill="#9184D9">//</tspan> LABORATÓRIO
</text>
<g class="ps-mono" font-size="10" letter-spacing="1.5">
<circle class="ps-live" cx="738" cy="17" r="3.5" fill="#9184D9" />
<text x="748" y="21" fill="#C4BEEC">LIVE</text>
</g>

<!-- Cantoneiras inferiores -->
<g fill="none" stroke="#9184D9" stroke-width="2" stroke-linecap="round" stroke-opacity=".8">
<path d="M10 294v16h16" />
<path d="M790 294v16h-16" />
</g>

<!-- Todo o conteúdo abaixo está deslocado 30px para baixo -->
<g transform="translate(0,30)">
<!-- ===== Cabeçalho da pesquisa ===== -->
<circle class="ps-bl" cx="38" cy="36" r="4" fill="#9184D9" />
<text class="ps-mono" x="50" y="40" font-size="12" letter-spacing="2"
fill="#9184D9">INICIAÇÃO CIENTÍFICA · EM ANDAMENTO</text>
<text class="ps-sans" x="32" y="74" font-size="21" font-weight="500" fill="#E9E9ED">Detecção
de Ameaças Cibernéticas baseada em IA</text>
<text class="ps-sans" x="32" y="100" font-size="15" fill="#C4BEEC">Análise Comportamental e
Preditiva</text>

<!-- ===== Rede neural (3 → 4 → 2) ===== -->
<!-- Conexões com fluxo animado -->
<g stroke="#9184D9" stroke-opacity=".45" fill="none">
<path class="ps-e"
d="M60 140L150 128M60 140L150 166M60 140L150 204M60 140L150 242M60 185L150 128M60 185L150 166M60 185L150 204M60 185L150 242M60 230L150 128M60 230L150 166M60 230L150 204M60 230L150 242" />
<path class="ps-e"
d="M150 128L240 160M150 166L240 160M150 204L240 160M150 242L240 160M150 128L240 216M150 166L240 216M150 204L240 216M150 242L240 216" />
</g>
<!-- Nós (ps-l2 / ps-l3 atrasam o brilho por camada) -->
<g stroke="#9184D9" stroke-width="1.5">
<circle class="ps-n" cx="60" cy="140" r="8" />
<circle class="ps-n" cx="60" cy="185" r="8" />
<circle class="ps-n" cx="60" cy="230" r="8" />
<circle class="ps-n ps-l2" cx="150" cy="128" r="8" />
<circle class="ps-n ps-l2" cx="150" cy="166" r="8" />
<circle class="ps-n ps-l2" cx="150" cy="204" r="8" />
<circle class="ps-n ps-l2" cx="150" cy="242" r="8" />
<circle class="ps-n ps-l3" cx="240" cy="160" r="8" />
<circle class="ps-n ps-l3" cx="240" cy="216" r="8" />
</g>
<!-- Saídas da rede -->
<g class="ps-mono" font-size="12">
<text x="256" y="164" fill="#9A9CB0">normal</text>
<text class="ps-th" x="256" y="220">ameaça</text>
</g>
<!-- Legendas das camadas -->
<g class="ps-mono" font-size="11" fill="#9A9CB0" text-anchor="middle">
<text x="60" y="274">comportamento</text>
<text x="150" y="274">modelo</text>
<text x="240" y="274">predição</text>
</g>

<!-- ===== Gráfico de anomalia ===== -->
<!-- Eixos -->
<path d="M340 250H768M340 130V250" stroke="#3a3c4e" />
<!-- Limiar -->
<path d="M340 170H768" stroke="#9184D9" stroke-opacity=".5" stroke-dasharray="6 6" />
<text class="ps-mono" x="768" y="162" font-size="11" fill="#9A9CB0" text-anchor="end">limiar
previsto</text>
<!-- Série de dados (pico em 600,138) — se mover o pico, mova também o anel e o alerta -->
<path class="ps-line" pathLength="1" fill="none" stroke="#C4BEEC" stroke-width="2"
stroke-linejoin="round"
d="M340 222L370 216L400 226L430 212L460 220L490 208L520 218L550 212L575 176L600 138L625 206L650 216L680 208L710 218L740 210L768 216" />
<!-- Onda que expande no pico -->
<circle class="ps-rg" cx="600" cy="138" r="5" fill="none" stroke="#E61518"
stroke-width="1.5" />
<!-- Alerta -->
<g class="ps-an">
<circle cx="600" cy="138" r="5" fill="#E61518" />
<text class="ps-mono" x="614" y="134" font-size="12" fill="#FFF100">⚠ anomalia
detectada</text>
</g>
</g>
</svg>
