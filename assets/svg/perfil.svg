<svg width="800" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img"
                        aria-label="Perfil da agente — Mariana Sena">
<style>.pf-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}.pf-sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}@keyframes pf-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}@keyframes pf-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}@keyframes pf-livep{0%,100%{opacity:.3}50%{opacity:1}}@keyframes pf-spin{to{transform:rotate(360deg)}}@keyframes pf-rspin{to{transform:rotate(-360deg)}}@keyframes pf-bar{0%,100%{transform:translateY(96px)}50%{transform:translateY(244px)}}@keyframes pf-core{0%,100%{opacity:.5}50%{opacity:1}}@keyframes pf-row{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes pf-stamp{0%{opacity:0;transform:scale(1.6)}60%{opacity:1;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}.pf-au1{animation:pf-drift1 14s ease-in-out infinite;}.pf-au2{animation:pf-drift2 18s ease-in-out infinite;}.pf-live{animation:pf-livep 1.6s ease-in-out infinite;}.pf-sp1{transform-origin:140px 170px;animation:pf-spin 12s linear infinite;}.pf-sp2{transform-origin:140px 170px;animation:pf-rspin 8s linear infinite;}.pf-bar{animation:pf-bar 3s ease-in-out infinite;}.pf-core{animation:pf-core 2s ease-in-out infinite;}.pf-stamp{transform-box:fill-box;transform-origin:center;animation:pf-stamp .6s 2.2s cubic-bezier(.3,1.6,.5,1) both;}.pf-row{animation:pf-row .8s cubic-bezier(.2,.8,.2,1) both;}</style>
<defs>
<!-- Borda com brilho que percorre a moldura -->
<linearGradient id="pf-bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0"
spreadMethod="reflect">
<stop offset="0" stop-color="#9184D9" stop-opacity=".15" />
<stop offset=".5" stop-color="#C4BEEC" stop-opacity=".95" />
<stop offset="1" stop-color="#9184D9" stop-opacity=".15" />
<animateTransform attributeName="gradientTransform" type="translate" from="0 0"
to="1600 0" dur="8s" repeatCount="indefinite" />
</linearGradient>
<filter id="pf-blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="40" />
</filter>
<clipPath id="pf-fc">
<rect width="800" height="330" rx="14" />
</clipPath>
<pattern id="pf-grid" width="26" height="26" patternUnits="userSpaceOnUse">
<path d="M26 0H0V26" fill="none" stroke="#9184D9" stroke-opacity=".07" />
</pattern>
<!-- Área circular onde a barra de scan aparece -->
<clipPath id="pf-sc">
<circle cx="140" cy="170" r="74" />
</clipPath>
<linearGradient id="pf-bg2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#9184D9" stop-opacity="0" />
<stop offset="1" stop-color="#9184D9" stop-opacity=".35" />
</linearGradient>
</defs>

<!-- ===== Fundo: cor, auroras, grade e barra de título ===== -->
<g clip-path="url(#pf-fc)">
<rect width="800" height="330" fill="#1a1c2b" />
<g filter="url(#pf-blur)" opacity=".6">
<ellipse class="pf-au1" cx="160" cy="264" rx="160" ry="70" fill="#9184D9"
fill-opacity=".3" />
<ellipse class="pf-au2" cx="640" cy="82.5" rx="180" ry="80" fill="#5a4f9e"
fill-opacity=".45" />
</g>
<rect y="35" width="800" height="295" fill="url(#pf-grid)" />
<rect width="800" height="34" fill="#161826" fill-opacity=".75" />
<rect y="34" width="800" height="1" fill="#9184D9" fill-opacity=".22" />
</g>

<!-- Moldura com gradiente animado -->
<rect x=".5" y=".5" width="799" height="329" rx="14" fill="none" stroke="url(#pf-bd)"
stroke-width="1.2" />

<!-- Barra de título: bolinhas, título e LIVE -->
<g fill="#4a4c63">
<circle cx="20" cy="17" r="4.5" />
<circle cx="35" cy="17" r="4.5" />
<circle cx="50" cy="17" r="4.5" />
</g>
<text class="pf-mono" x="68" y="21" font-size="11" letter-spacing="1.5" fill="#9A9CB0">MARI.EXE
<tspan fill="#9184D9">//</tspan> PERFIL DA AGENTE
</text>
<g class="pf-mono" font-size="10" letter-spacing="1.5">
<circle class="pf-live" cx="738" cy="17" r="3.5" fill="#9184D9" />
<text x="748" y="21" fill="#C4BEEC">LIVE</text>
</g>

<!-- Cantoneiras inferiores -->
<g fill="none" stroke="#9184D9" stroke-width="2" stroke-linecap="round" stroke-opacity=".8">
<path d="M10 304v16h16" />
<path d="M790 304v16h-16" />
</g>

<!-- ===== Biometria: anéis tipo digital (centro em 140,170) ===== -->
<g fill="none" stroke="#54F21B" stroke-linecap="round">
<circle class="pf-sp1" cx="140" cy="170" r="74" stroke-opacity=".3"
stroke-dasharray="1 6" />
<circle class="pf-sp2" cx="140" cy="170" r="62" stroke-opacity=".8" stroke-width="2"
stroke-dasharray="90 40 20 40" />
<circle class="pf-sp1" cx="140" cy="170" r="50" stroke-opacity=".6" stroke-width="2"
stroke-dasharray="50 24" />
<circle class="pf-sp2" cx="140" cy="170" r="38" stroke-opacity=".9" stroke-width="2"
stroke-dasharray="30 18 6 18" />
<circle class="pf-sp1" cx="140" cy="170" r="26" stroke-opacity=".7" stroke-width="2"
stroke-dasharray="14 10" />
</g>
<circle class="pf-core" cx="140" cy="170" r="8" fill="#54F21B" />

<!-- Barra de scan subindo e descendo dentro do círculo -->
<g clip-path="url(#pf-sc)">
<g class="pf-bar">
<rect x="60" y="-30" width="160" height="30" fill="url(#pf-bg2)" />
<rect x="60" y="0" width="160" height="3" fill="#C4BEEC" />
</g>
</g>

<text class="pf-mono" x="140" y="272" font-size="11" letter-spacing="2" fill="#54F21B"
text-anchor="middle">BIOMETRIA</text>

<!-- Selo "confirmada" (entra com efeito de carimbo) -->
<g class="pf-stamp">
<rect x="70" y="282" width="140" height="24" rx="12" fill="#2a2648" stroke="#54F21B" />
<text class="pf-mono" x="140" y="298" font-size="11" letter-spacing="1.5" fill="#54F21B"
text-anchor="middle">✓ CONFIRMADA</text>
</g>

<!-- ===== Ficha da agente =====
Cada linha: rótulo (x=268), valor (x=392), separador.
Espaçamento de 34 no y; animation-delay cresce 0.18s por linha. -->
<g class="pf-row" style="animation-delay:0.50s">
<text class="pf-mono" x="268" y="74" font-size="11" letter-spacing="1"
fill="#9A9CB0">CODINOME</text>
<text class="pf-sans" x="392" y="74" font-size="14" fill="#E9E9ED">Mariana ·
@mariisena</text>
<rect x="268" y="86" width="500" height="1" fill="#9184D9" fill-opacity=".12" />
</g>
<g class="pf-row" style="animation-delay:0.68s">
<text class="pf-mono" x="268" y="108" font-size="11" letter-spacing="1"
fill="#9A9CB0">CLASSE</text>
<text class="pf-sans" x="392" y="108" font-size="14" fill="#E9E9ED">Estudante de Ciência da
Computação · CEUB</text>
<rect x="268" y="120" width="500" height="1" fill="#9184D9" fill-opacity=".12" />
</g>
<g class="pf-row" style="animation-delay:0.86s">
<text class="pf-mono" x="268" y="142" font-size="11" letter-spacing="1"
fill="#9A9CB0">NÍVEL</text>
<text class="pf-sans" x="392" y="142" font-size="14" fill="#E9E9ED">5º semestre</text>
<rect x="268" y="154" width="500" height="1" fill="#9184D9" fill-opacity=".12" />
</g>
<g class="pf-row" style="animation-delay:1.04s">
<text class="pf-mono" x="268" y="176" font-size="11" letter-spacing="1"
fill="#9A9CB0">FACÇÃO</text>
<text class="pf-sans" x="392" y="176" font-size="14" fill="#E9E9ED">Liga Acadêmica de
Cibersegurança Café com Ciber</text>
<rect x="268" y="188" width="500" height="1" fill="#9184D9" fill-opacity=".12" />
</g>
<g class="pf-row" style="animation-delay:1.22s">
<text class="pf-mono" x="268" y="210" font-size="11" letter-spacing="1"
fill="#9A9CB0">CARGO</text>
<text class="pf-sans" x="392" y="210" font-size="14" fill="#C4BEEC">Líder · IA, Fraudes
Digitais e Ameaças Emergentes</text>
<rect x="268" y="222" width="500" height="1" fill="#9184D9" fill-opacity=".12" />
</g>
<g class="pf-row" style="animation-delay:1.40s">
<text class="pf-mono" x="268" y="244" font-size="11" letter-spacing="1"
fill="#9A9CB0">FOCO</text>
<text class="pf-sans" x="392" y="244" font-size="14" fill="#E9E9ED">IA · Dados ·
Cibersegurança</text>
<rect x="268" y="256" width="500" height="1" fill="#9184D9" fill-opacity=".12" />
</g>
<g class="pf-row" style="animation-delay:1.58s">
<text class="pf-mono" x="268" y="278" font-size="11" letter-spacing="1"
fill="#9A9CB0">IDIOMAS</text>
<text class="pf-sans" x="392" y="278" font-size="14" fill="#E9E9ED">Português (nativo) ·
Inglês (intermediário)</text>
<rect x="268" y="290" width="500" height="1" fill="#9184D9" fill-opacity=".12" />
</g>
</svg>
