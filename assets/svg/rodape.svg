<svg width="800" height="170" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" role="img"
                        aria-label="Obrigada pela visita · volte sempre">
<style>.rp-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}.rp-sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}@keyframes rp-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}@keyframes rp-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}@keyframes rp-livep{0%,100%{opacity:.3}50%{opacity:1}}@keyframes rp-blink{50%{opacity:0}}@keyframes rp-rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-110px);opacity:0}}@keyframes rp-steam{0%,100%{opacity:.5}50%{opacity:1}}@keyframes rp-w1{to{transform:translateX(-200px)}}@keyframes rp-w2{to{transform:translateX(-260px)}}.rp-au1{animation:rp-drift1 14s ease-in-out infinite;}.rp-au2{animation:rp-drift2 18s ease-in-out infinite;}.rp-live{animation:rp-livep 1.6s ease-in-out infinite;}.rp-c{animation:rp-blink 1s steps(1) infinite;}.rp-r{animation:rp-rise 3.5s ease-out infinite;}.rp-s{animation:rp-steam 2s ease-in-out infinite;}.rp-wv1{animation:rp-w1 6s linear infinite;}.rp-wv2{animation:rp-w2 9s linear infinite;}</style>
<defs>
<!-- Borda com brilho que percorre a moldura -->
<linearGradient id="rp-bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0"
spreadMethod="reflect">
<stop offset="0" stop-color="#9184D9" stop-opacity=".15" />
<stop offset=".5" stop-color="#C4BEEC" stop-opacity=".95" />
<stop offset="1" stop-color="#9184D9" stop-opacity=".15" />
<animateTransform attributeName="gradientTransform" type="translate" from="0 0"
to="1600 0" dur="8s" repeatCount="indefinite" />
</linearGradient>
<filter id="rp-blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="40" />
</filter>
<clipPath id="rp-fc">
<rect width="800" height="170" rx="14" />
</clipPath>
<pattern id="rp-grid" width="26" height="26" patternUnits="userSpaceOnUse">
<path d="M26 0H0V26" fill="none" stroke="#9184D9" stroke-opacity=".07" />
</pattern>
</defs>

<!-- ===== Fundo: cor, auroras, grade e barra de título ===== -->
<g clip-path="url(#rp-fc)">
<rect width="800" height="170" fill="#1a1c2b" />
<g filter="url(#rp-blur)" opacity=".6">
<ellipse class="rp-au1" cx="160" cy="136" rx="160" ry="70" fill="#9184D9"
fill-opacity=".3" />
<ellipse class="rp-au2" cx="640" cy="42.5" rx="180" ry="80" fill="#5a4f9e"
fill-opacity=".45" />
</g>
<rect y="35" width="800" height="135" fill="url(#rp-grid)" />
<rect width="800" height="34" fill="#161826" fill-opacity=".75" />
<rect y="34" width="800" height="1" fill="#9184D9" fill-opacity=".22" />
</g>

<!-- Moldura com gradiente animado -->
<rect x=".5" y=".5" width="799" height="169" rx="14" fill="none" stroke="url(#rp-bd)"
stroke-width="1.2" />

<!-- Barra de título: bolinhas, título e LIVE -->
<g fill="#4a4c63">
<circle cx="20" cy="17" r="4.5" />
<circle cx="35" cy="17" r="4.5" />
<circle cx="50" cy="17" r="4.5" />
</g>
<text class="rp-mono" x="68" y="21" font-size="11" letter-spacing="1.5" fill="#9A9CB0">MARI.EXE
<tspan fill="#9184D9">//</tspan> SHUTDOWN</text>
<g class="rp-mono" font-size="10" letter-spacing="1.5">
<circle class="rp-live" cx="738" cy="17" r="3.5" fill="#9184D9" />
<text x="748" y="21" fill="#C4BEEC">LIVE</text>
</g>

<!-- Cantoneiras inferiores -->
<g fill="none" stroke="#9184D9" stroke-width="2" stroke-linecap="round" stroke-opacity=".8">
<path d="M10 144v16h16" />
<path d="M790 144v16h-16" />
</g>

<g clip-path="url(#rp-fc)">
<!-- Bits subindo (x = coluna, delay = ritmo) -->
<g class="rp-mono" font-size="11" fill="#9184D9">
<text class="rp-r" x="120" y="150">1</text>
<text class="rp-r" x="260" y="150" style="animation-delay:.8s">0</text>
<text class="rp-r" x="540" y="150" style="animation-delay:1.6s">1</text>
<text class="rp-r" x="680" y="150" style="animation-delay:2.2s">0</text>
<text class="rp-r" x="400" y="150" style="animation-delay:1.2s">1</text>
</g>
<!-- Ondas da base -->
<path class="rp-wv2"
d="M0 140 Q65 133 130 140 T260 140 T390 140 T520 140 T650 140 T780 140 T910 140 T1040 140 T1170 140 T1300 140 T1430 140 V170 H0 Z"
fill="#9184D9" fill-opacity=".14" />
<path class="rp-wv1"
d="M0 150 Q50 141 100 150 T200 150 T300 150 T400 150 T500 150 T600 150 T700 150 T800 150 T900 150 T1000 150 T1100 150 T1200 150 T1300 150 V170 H0 Z"
fill="#9184D9" fill-opacity=".22" />
<path class="rp-wv1"
d="M0 150 Q50 141 100 150 T200 150 T300 150 T400 150 T500 150 T600 150 T700 150 T800 150 T900 150 T1000 150 T1100 150 T1200 150 T1300 150"
fill="none" stroke="#C4BEEC" stroke-opacity=".5" />
</g>

<!-- ===== Mensagem final ===== -->
<text class="rp-mono" x="400" y="72" font-size="13" fill="#9A9CB0"
text-anchor="middle">mari@ceub:~$ shutdown --agente mariisena</text>
<text class="rp-sans" x="400" y="104" font-size="19" fill="#E9E9ED"
text-anchor="middle">obrigada pela visita · volte sempre <tspan class="rp-s">☕</tspan>
<tspan class="rp-mono rp-c" fill="#C4BEEC">_</tspan>
</text>
</svg>
