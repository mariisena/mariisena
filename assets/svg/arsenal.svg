<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img"
    aria-label="Arsenal — Python, HTML5, CSS, MySQL, Git, GitHub, Docker, Claude Code">
<style>.ar-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes ar-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}@keyframes ar-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}@keyframes ar-livep{0%,100%{opacity:.3}50%{opacity:1}}@keyframes ar-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.ar-au1{animation:ar-drift1 14s ease-in-out infinite}.ar-au2{animation:ar-drift2 18s ease-in-out infinite}.ar-live{animation:ar-livep 1.6s ease-in-out infinite}.ar-chip{animation:ar-up .5s ease-out both}</style>
<defs>
    <linearGradient id="ar-bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0" spreadMethod="reflect">
        <stop offset="0" stop-color="#9184D9" stop-opacity=".15" />
        <stop offset=".5" stop-color="#C4BEEC" stop-opacity=".95" />
        <stop offset="1" stop-color="#9184D9" stop-opacity=".15" />
        <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1600 0" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="ar-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40" /></filter>
    <clipPath id="ar-fc"><rect width="800" height="250" rx="14" /></clipPath>
    <pattern id="ar-grid" width="26" height="26" patternUnits="userSpaceOnUse">
        <path d="M26 0H0V26" fill="none" stroke="#9184D9" stroke-opacity=".07" />
    </pattern>
</defs>

<!-- ===== Fundo: cor, auroras, grade e barra de título ===== -->
<g clip-path="url(#ar-fc)">
    <rect width="800" height="250" fill="#1a1c2b" />
    <g filter="url(#ar-blur)" opacity=".6">
        <ellipse class="ar-au1" cx="160" cy="200" rx="160" ry="70" fill="#9184D9" fill-opacity=".3" />
        <ellipse class="ar-au2" cx="640" cy="62.5" rx="180" ry="80" fill="#5a4f9e" fill-opacity=".45" />
    </g>
    <rect y="35" width="800" height="215" fill="url(#ar-grid)" />
    <rect width="800" height="34" fill="#161826" fill-opacity=".75" />
    <rect y="34" width="800" height="1" fill="#9184D9" fill-opacity=".22" />
</g>
<rect x=".5" y=".5" width="799" height="249" rx="14" fill="none" stroke="url(#ar-bd)" stroke-width="1.2" />

<!-- Barra de título -->
<g fill="#4a4c63"><circle cx="20" cy="17" r="4.5" /><circle cx="35" cy="17" r="4.5" /><circle cx="50" cy="17" r="4.5" /></g>
<text class="ar-mono" x="68" y="21" font-size="11" letter-spacing="1.5" fill="#9A9CB0">MARI.EXE <tspan fill="#9184D9">//</tspan> ARSENAL</text>
<g class="ar-mono" font-size="10" letter-spacing="1.5">
    <circle class="ar-live" cx="738" cy="17" r="3.5" fill="#9184D9" />
    <text x="748" y="21" fill="#C4BEEC">LIVE</text>
</g>

<!-- Cantoneiras inferiores -->
<g fill="none" stroke="#9184D9" stroke-width="2" stroke-linecap="round" stroke-opacity=".8">
    <path d="M10 224v16h16" /><path d="M790 224v16h-16" />
</g>

