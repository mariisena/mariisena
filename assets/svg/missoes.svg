<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img"
                        aria-label="Mapa da missão — etapas concluídas, atual e próxima">
<style>.ms-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}.ms-sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}@keyframes ms-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}@keyframes ms-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}@keyframes ms-livep{0%,100%{opacity:.3}50%{opacity:1}}@keyframes ms-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes ms-pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}@keyframes ms-fade{from{opacity:0}to{opacity:1}}@keyframes ms-ring{0%{r:12px;opacity:.9}100%{r:34px;opacity:0}}@keyframes ms-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes ms-march{to{stroke-dashoffset:-20}}@keyframes ms-shake{0%,84%,100%{transform:rotate(0)}87%{transform:rotate(-14deg)}91%{transform:rotate(12deg)}95%{transform:rotate(-6deg)}}.ms-au1{animation:ms-drift1 14s ease-in-out infinite;}.ms-au2{animation:ms-drift2 18s ease-in-out infinite;}.ms-live{animation:ms-livep 1.6s ease-in-out infinite;}.ms-dr{stroke-dasharray:1;animation:ms-draw 2.4s cubic-bezier(.4,0,.2,1) both;}.ms-n{transform-box:fill-box;transform-origin:center;animation:ms-pop .5s cubic-bezier(.3,1.5,.5,1) both;}.ms-f{animation:ms-fade .5s ease-out both;}.ms-rg{animation:ms-ring 2s ease-out infinite;}.ms-pin{animation:ms-bounce 1.4s ease-in-out infinite;}.ms-fut{stroke-dasharray:6 6;animation:ms-march 1.2s linear infinite;}.ms-lk{transform-box:fill-box;transform-origin:50% 10%;animation:ms-shake 4s ease-in-out infinite;}</style>
<defs>
<!-- Borda com brilho que percorre a moldura -->
<linearGradient id="ms-bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0"
spreadMethod="reflect">
<stop offset="0" stop-color="#9184D9" stop-opacity=".15" />
<stop offset=".5" stop-color="#C4BEEC" stop-opacity=".95" />
<stop offset="1" stop-color="#9184D9" stop-opacity=".15" />
<animateTransform attributeName="gradientTransform" type="translate" from="0 0"
to="1600 0" dur="8s" repeatCount="indefinite" />
</linearGradient>
<filter id="ms-blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="40" />
</filter>
<clipPath id="ms-fc">
<rect width="800" height="250" rx="14" />
</clipPath>
<pattern id="ms-grid" width="26" height="26" patternUnits="userSpaceOnUse">
<path d="M26 0H0V26" fill="none" stroke="#9184D9" stroke-opacity=".07" />
</pattern>
<!-- Brilho do "cometa" que percorre a trilha -->
<radialGradient id="ms-cm">
<stop offset="0" stop-color="#E9E9ED" />
<stop offset=".4" stop-color="#C4BEEC" />
<stop offset="1" stop-color="#9184D9" stop-opacity="0" />
</radialGradient>
</defs>

<!-- ===== Fundo: cor, auroras, grade e barra de título ===== -->
<g clip-path="url(#ms-fc)">
<rect width="800" height="250" fill="#1a1c2b" />
<g filter="url(#ms-blur)" opacity=".6">
<ellipse class="ms-au1" cx="160" cy="200" rx="160" ry="70" fill="#9184D9"
fill-opacity=".3" />
<ellipse class="ms-au2" cx="640" cy="62.5" rx="180" ry="80" fill="#5a4f9e"
fill-opacity=".45" />
</g>
<rect y="35" width="800" height="215" fill="url(#ms-grid)" />
<rect width="800" height="34" fill="#161826" fill-opacity=".75" />
<rect y="34" width="800" height="1" fill="#9184D9" fill-opacity=".22" />
</g>

<!-- Moldura com gradiente animado -->
<rect x=".5" y=".5" width="799" height="249" rx="14" fill="none" stroke="url(#ms-bd)"
stroke-width="1.2" />

<!-- Barra de título: bolinhas, título e LIVE -->
<g fill="#4a4c63">
<circle cx="20" cy="17" r="4.5" />
<circle cx="35" cy="17" r="4.5" />
<circle cx="50" cy="17" r="4.5" />
</g>
<text class="ms-mono" x="68" y="21" font-size="11" letter-spacing="1.5" fill="#9A9CB0">MARI.EXE
<tspan fill="#9184D9">//</tspan> MISSÃO 1 - GRADUAÇÃO CIÊNCIA DA COMPUTAÇÃO
</text>
<g class="ms-mono" font-size="10" letter-spacing="1.5">
<circle class="ms-live" cx="738" cy="17" r="3.5" fill="#9184D9" />
<text x="748" y="21" fill="#C4BEEC">LIVE</text>
</g>

<!-- Cantoneiras inferiores -->
<g fill="none" stroke="#9184D9" stroke-width="2" stroke-linecap="round" stroke-opacity=".8">
<path d="M10 224v16h16" />
<path d="M790 224v16h-16" />
</g>

<!-- Todo o conteúdo abaixo está deslocado 30px para baixo.
8 nós a cada 96px, alternando baixo (y=150) e cima (y=92):
1º 64,150 · 2º 160,92 · 3º 256,150 · 4º 352,92 · 5º 448,150 (atual)
6º 544,92 · 7º 640,150 · 8º 736,92
Rótulos: nós de baixo → texto embaixo (y 186/203); nós de cima → texto em cima (y 52/68).
Curva entre dois nós: "C (x1+48) y1 (x1+48) y2 x2 y2". -->
<g transform="translate(0,30)">
<!-- ===== Trilha ===== -->
<!-- Trecho futuro: 5º → 8º (tracejado em movimento) -->
<path class="ms-fut"
d="M448 150C496 150 496 92 544 92C592 92 592 150 640 150C688 150 688 92 736 92"
fill="none" stroke="#4a4c63" stroke-width="2" />
<!-- Trilho de fundo do trecho percorrido: 1º → 5º -->
<path
d="M64 150C112 150 112 92 160 92C208 92 208 150 256 150C304 150 304 92 352 92C400 92 400 150 448 150"
fill="none" stroke="#2a2c3c" stroke-width="6" stroke-linecap="round" />
<!-- Trecho percorrido (se desenha ao carregar) — mesmo "d" do trilho -->
<path class="ms-dr" pathLength="1"
d="M64 150C112 150 112 92 160 92C208 92 208 150 256 150C304 150 304 92 352 92C400 92 400 150 448 150"
fill="none" stroke="#9184D9" stroke-width="3" stroke-linecap="round" />
<!-- Cometa percorrendo o trecho — mesmo "d" do trilho -->
<circle r="9" fill="url(#ms-cm)">
<animateMotion dur="3s" begin="2.6s" repeatCount="indefinite"
path="M64 150C112 150 112 92 160 92C208 92 208 150 256 150C304 150 304 92 352 92C400 92 400 150 448 150" />
</circle>

<!-- ===== Nós concluídos (check: "M x-6 y l4 4 8-8") ===== -->
<g stroke="#9184D9" stroke-width="2">
<!-- 1º semestre -->
<g class="ms-n" style="animation-delay:.2s">
<circle cx="64" cy="150" r="12" fill="#2a2648" />
<path d="M58 150l4 4 8-8" fill="none" stroke="#E9E9ED" />
</g>
<!-- 2º semestre -->
<g class="ms-n" style="animation-delay:.8s">
<circle cx="160" cy="92" r="12" fill="#2a2648" />
<path d="M154 92l4 4 8-8" fill="none" stroke="#E9E9ED" />
</g>
<!-- 3º semestre -->
<g class="ms-n" style="animation-delay:1.4s">
<circle cx="256" cy="150" r="12" fill="#2a2648" />
<path d="M250 150l4 4 8-8" fill="none" stroke="#E9E9ED" />
</g>
<!-- 4º semestre -->
<g class="ms-n" style="animation-delay:2s">
<circle cx="352" cy="92" r="12" fill="#2a2648" />
<path d="M346 92l4 4 8-8" fill="none" stroke="#E9E9ED" />
</g>
</g>

<!-- ===== Nó atual: 5º semestre (com ondas pulsando) ===== -->
<circle class="ms-rg" cx="448" cy="150" r="12" fill="none" stroke="#C4BEEC"
style="animation-delay:2.4s" />
<circle class="ms-rg" cx="448" cy="150" r="12" fill="none" stroke="#C4BEEC"
style="animation-delay:3.4s" />
<g class="ms-n" style="animation-delay:2.3s">
<circle cx="448" cy="150" r="12" fill="#9184D9" />
<circle cx="448" cy="150" r="4" fill="#E9E9ED" />
</g>

<!-- ===== Nós futuros (tracejados com cadeado balançando) ===== -->
<!-- 6º semestre -->
<g class="ms-n" style="animation-delay:2.6s">
<circle cx="544" cy="92" r="12" fill="#1c1e2c" stroke="#4a4c63" stroke-width="2"
stroke-dasharray="4 4" />
<g class="ms-lk"><text x="544" y="97" font-size="12" text-anchor="middle">🔒</text></g>
</g>
<!-- 7º semestre -->
<g class="ms-n" style="animation-delay:2.75s">
<circle cx="640" cy="150" r="12" fill="#1c1e2c" stroke="#4a4c63" stroke-width="2"
stroke-dasharray="4 4" />
<g class="ms-lk" style="animation-delay:.4s"><text x="640" y="155" font-size="12"
text-anchor="middle">🔒</text></g>
</g>
<!-- 8º semestre -->
<g class="ms-n" style="animation-delay:2.9s">
<circle cx="736" cy="92" r="12" fill="#1c1e2c" stroke="#4a4c63" stroke-width="2"
stroke-dasharray="4 4" />
<g class="ms-lk" style="animation-delay:.8s"><text x="736" y="97" font-size="12"
text-anchor="middle">🔒</text></g>
</g>

<!-- Balão "VOCÊ ESTÁ AQUI" sobre o nó atual (centro x=448; ponta encosta em y≈103) -->
<g class="ms-f" style="animation-delay:2.7s">
<g class="ms-pin">
<rect x="396" y="74" width="104" height="22" rx="11" fill="#9184D9" />
<path d="M442 96l6 7 6-7z" fill="#9184D9" />
<text class="ms-mono" x="448" y="89" font-size="10" letter-spacing="1"
fill="#161826" text-anchor="middle">VOCÊ ESTÁ AQUI</text>
</g>
</g>

<!-- ===== Rótulos das etapas (título + status) ===== -->
<g class="ms-sans" font-size="14" text-anchor="middle">
<!-- Concluídos -->
<g class="ms-f" style="animation-delay:.4s">
<text x="64" y="186" fill="#E9E9ED">1º semestre</text>
<text class="ms-mono" x="64" y="203" font-size="10" fill="#9A9CB0">CONCLUÍDA</text>
</g>
<g class="ms-f" style="animation-delay:1s">
<text x="160" y="52" fill="#E9E9ED">2º semestre</text>
<text class="ms-mono" x="160" y="68" font-size="10" fill="#9A9CB0">CONCLUÍDA</text>
</g>
<g class="ms-f" style="animation-delay:1.6s">
<text x="256" y="186" fill="#E9E9ED">3º semestre</text>
<text class="ms-mono" x="256" y="203" font-size="10" fill="#9A9CB0">CONCLUÍDA</text>
</g>
<g class="ms-f" style="animation-delay:2.2s">
<text x="352" y="52" fill="#E9E9ED">4º semestre</text>
<text class="ms-mono" x="352" y="68" font-size="10" fill="#9A9CB0">CONCLUÍDA</text>
</g>
<!-- Atual -->
<g class="ms-f" style="animation-delay:2.5s">
<text x="448" y="186" fill="#C4BEEC">5º semestre</text>
<text class="ms-mono" x="448" y="203" font-size="10" fill="#9184D9">EM
ANDAMENTO</text>
</g>
<!-- Futuros -->
<g class="ms-f" style="animation-delay:2.8s">
<text x="544" y="52" fill="#9A9CB0">6º semestre</text>
<text class="ms-mono" x="544" y="68" font-size="10" fill="#9A9CB0">PRÓXIMA
FASE</text>
</g>
<g class="ms-f" style="animation-delay:2.95s">
<text x="640" y="186" fill="#9A9CB0">7º semestre</text>
<text class="ms-mono" x="640" y="203" font-size="10" fill="#9A9CB0">...</text>
</g>
<g class="ms-f" style="animation-delay:3.1s">
<text x="736" y="52" fill="#9A9CB0">8º semestre</text>
<text class="ms-mono" x="736" y="68" font-size="10" fill="#9A9CB0">...</text>
</g>
</g>
</g>
</svg>
