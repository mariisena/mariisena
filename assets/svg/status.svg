<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img"
                        aria-label="Status da missão — graduação, liderança e iniciação científica">
<style>.st-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}.st-sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}@keyframes st-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}@keyframes st-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}@keyframes st-livep{0%,100%{opacity:.3}50%{opacity:1}}@keyframes st-spin{to{transform:rotate(360deg)}}@keyframes st-rspin{to{transform:rotate(-360deg)}}@keyframes st-fill1{from{stroke-dasharray:0 100}to{stroke-dasharray:62.5 100}}@keyframes st-breath{0%,100%{stroke-dasharray:12 88}50%{stroke-dasharray:68 32}}@keyframes st-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.st-au1{animation:st-drift1 14s ease-in-out infinite;}.st-au2{animation:st-drift2 18s ease-in-out infinite;}.st-live{animation:st-livep 1.6s ease-in-out infinite;}.st-tick{animation:st-spin 30s linear infinite;}.st-a1{transform:rotate(-90deg);animation:st-fill1 2.2s .4s cubic-bezier(.2,.8,.2,1) both;}.st-a2{stroke-dasharray:28 72;animation:st-spin 3s linear infinite;}.st-a2b{stroke-dasharray:12 88;animation:st-rspin 5s linear infinite;}.st-a3{animation:st-breath 3s ease-in-out infinite,st-spin 9s linear infinite;}.st-bob{animation:st-bob 2s ease-in-out infinite;}</style>
<defs>
<!-- Borda com brilho que percorre a moldura -->
<linearGradient id="st-bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0"
spreadMethod="reflect">
<stop offset="0" stop-color="#9184D9" stop-opacity=".15" />
<stop offset=".5" stop-color="#C4BEEC" stop-opacity=".95" />
<stop offset="1" stop-color="#9184D9" stop-opacity=".15" />
<animateTransform attributeName="gradientTransform" type="translate" from="0 0"
to="1600 0" dur="8s" repeatCount="indefinite" />
</linearGradient>
<filter id="st-blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="40" />
</filter>
<clipPath id="st-fc">
<rect width="800" height="280" rx="14" />
</clipPath>
<pattern id="st-grid" width="26" height="26" patternUnits="userSpaceOnUse">
<path d="M26 0H0V26" fill="none" stroke="#9184D9" stroke-opacity=".07" />
</pattern>
<!-- Gradiente dos arcos -->
<linearGradient id="st-ag" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#C4BEEC" />
<stop offset="1" stop-color="#9184D9" />
</linearGradient>
</defs>

<!-- ===== Fundo: cor, auroras, grade e barra de título ===== -->
<g clip-path="url(#st-fc)">
<rect width="800" height="280" fill="#1a1c2b" />
<g filter="url(#st-blur)" opacity=".6">
<ellipse class="st-au1" cx="160" cy="224" rx="160" ry="70" fill="#9184D9"
fill-opacity=".3" />
<ellipse class="st-au2" cx="640" cy="70" rx="180" ry="80" fill="#5a4f9e"
fill-opacity=".45" />
</g>
<rect y="35" width="800" height="245" fill="url(#st-grid)" />
<rect width="800" height="34" fill="#161826" fill-opacity=".75" />
<rect y="34" width="800" height="1" fill="#9184D9" fill-opacity=".22" />
</g>

<!-- Moldura com gradiente animado -->
<rect x=".5" y=".5" width="799" height="279" rx="14" fill="none" stroke="url(#st-bd)"
stroke-width="1.2" />

<!-- Barra de título: bolinhas, título e LIVE -->
<g fill="#4a4c63">
<circle cx="20" cy="17" r="4.5" />
<circle cx="35" cy="17" r="4.5" />
<circle cx="50" cy="17" r="4.5" />
</g>
<text class="st-mono" x="68" y="21" font-size="11" letter-spacing="1.5" fill="#9A9CB0">MARI.EXE
<tspan fill="#9184D9">//</tspan> STATUS DA MISSÃO
</text>
<g class="st-mono" font-size="10" letter-spacing="1.5">
<circle class="st-live" cx="738" cy="17" r="3.5" fill="#9184D9" />
<text x="748" y="21" fill="#C4BEEC">LIVE</text>
</g>

<!-- Cantoneiras inferiores -->
<g fill="none" stroke="#9184D9" stroke-width="2" stroke-linecap="round" stroke-opacity=".8">
<path d="M10 254v16h16" />
<path d="M790 254v16h-16" />
</g>

<!-- ===== Anel 1 — Graduação (centro 150,140): progresso que preenche ===== -->
<circle class="st-tick" cx="150" cy="140" r="66" fill="none" stroke="#9184D9"
stroke-opacity=".35" stroke-dasharray="1 5" style="transform-origin:150px 140px" />
<circle cx="150" cy="140" r="52" fill="none" stroke="#2a2c3c" stroke-width="8" />
<circle class="st-a1" cx="150" cy="140" r="52" fill="none" stroke="url(#st-ag)" stroke-width="8"
stroke-linecap="round" pathLength="100" style="transform-origin:150px 140px" />
<text class="st-sans" x="150" y="146" font-size="26" font-weight="500" fill="#E9E9ED"
text-anchor="middle">5/8</text>
<text class="st-mono" x="150" y="164" font-size="9" letter-spacing="1.5" fill="#9A9CB0"
text-anchor="middle">SEMESTRES</text>
<text class="st-mono" x="150" y="228" font-size="11" letter-spacing="2" fill="#9184D9"
text-anchor="middle">GRADUAÇÃO</text>
<text class="st-sans" x="150" y="248" font-size="14" fill="#E9E9ED" text-anchor="middle">Ciência
da Computação</text>

<!-- ===== Anel 2 — Liderança (centro 400,140): arcos girando em sentidos opostos ===== -->
<circle class="st-tick" cx="400" cy="140" r="66" fill="none" stroke="#9184D9"
stroke-opacity=".35" stroke-dasharray="1 5" style="transform-origin:400px 140px" />
<circle cx="400" cy="140" r="52" fill="none" stroke="#2a2c3c" stroke-width="8" />
<circle class="st-a2" cx="400" cy="140" r="52" fill="none" stroke="url(#st-ag)" stroke-width="8"
stroke-linecap="round" pathLength="100" style="transform-origin:400px 140px" />
<circle class="st-a2b" cx="400" cy="140" r="52" fill="none" stroke="#C4BEEC" stroke-opacity=".5"
stroke-width="8" stroke-linecap="round" pathLength="100"
style="transform-origin:400px 140px" />
<text class="st-bob" x="400" y="150" font-size="28" text-anchor="middle">☕</text>
<text class="st-mono" x="400" y="228" font-size="11" letter-spacing="2" fill="#9184D9"
text-anchor="middle">LIDERANÇA</text>
<text class="st-sans" x="400" y="248" font-size="14" fill="#E9E9ED" text-anchor="middle">Café
com Ciber · IA e Fraudes</text>

<!-- ===== Anel 3 — Iniciação Científica (centro 650,140): arco "respirando" ===== -->
<circle class="st-tick" cx="650" cy="140" r="66" fill="none" stroke="#9184D9"
stroke-opacity=".35" stroke-dasharray="1 5" style="transform-origin:650px 140px" />
<circle cx="650" cy="140" r="52" fill="none" stroke="#2a2c3c" stroke-width="8" />
<circle class="st-a3" cx="650" cy="140" r="52" fill="none" stroke="url(#st-ag)" stroke-width="8"
stroke-linecap="round" pathLength="100" style="transform-origin:650px 140px" />
<text class="st-bob" x="650" y="150" font-size="28" text-anchor="middle"
style="animation-delay:.5s">🔬</text>
<text class="st-mono" x="650" y="228" font-size="11" letter-spacing="2" fill="#9184D9"
text-anchor="middle">INICIAÇÃO CIENTÍFICA</text>
<text class="st-sans" x="650" y="248" font-size="14" fill="#E9E9ED"
text-anchor="middle">Detecção de ameaças com IA</text>
</svg>
