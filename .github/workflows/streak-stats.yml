name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Run any time this file is modified
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Cores iguais às do portfólio (mesmos parâmetros da URL do streak-stats.demolab.com)
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: >-
            user=${{ github.repository_owner }}&locale=pt_BR&background=161826&border=2a2648&stroke=9184D9&ring=9184D9&fire=C4BEEC&currStreakNum=E9E9ED&sideNums=E9E9ED&currStreakLabel=9184D9&sideLabels=9A9CB0&dates=9A9CB0
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
